name: Deploy to GitHub Pages

# Every push gives a URL that can be opened on the iPad and the iPhone, which
# is the only way this project gets tested.
on:
  push:
    branches:
      - claude/swaranjali-spec-setup-gfp5y1
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs typecheck, generates the icons and launch screens, builds, and
      # writes the service worker precache list.
      - run: npm run build

      # enablement turns Pages on for the repository the first time this runs,
      # so there is nothing to configure by hand in the repo settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
