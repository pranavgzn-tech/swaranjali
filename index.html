<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>Swaranjali</title>

    <!-- The apple- tags still do the real work on iOS; the manifest alone is not
         enough. black-translucent plus viewport-fit=cover is what lets the
         instrument run edge to edge under the status bar (doc 12). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swaranjali" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2A1A12" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <!-- Launch screens. Without these iOS shows a white flash on every cold
         launch. Device pixel sizes are from the table in doc 12; the media
         queries use logical points, which iOS reports in portrait terms for
         both orientations. -->
    <link
      rel="apple-touch-startup-image"
      href="launch/launch-1640x2360.png"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="launch/launch-2360x1640.png"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
    />
    <link
      rel="apple-touch-startup-image"
      href="launch/launch-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="launch/launch-2556x1179.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
    />
    <link
      rel="apple-touch-startup-image"
      href="launch/launch-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="launch/launch-2796x1290.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
    />
  </head>
  <body>
    <div id="app"></div>

    <!--
      Boot guard. Deliberately inline and deliberately first, so it still runs
      when the module bundle does not: a cache-first service worker can pin a
      device to a stale shell, and the failure looked like a black screen with
      nothing to read. An instrument may fail, but it must always say so.
    -->
    <script>
      (function () {
        var reset = /[?&]reset\b/.test(location.search);

        function show(message, detail) {
          var app = document.getElementById('app');
          if (!app || app.dataset.booted === 'yes') return;
          app.innerHTML =
            '<div class="bootfail">' +
            '<p class="bootfail__line">' + message + '</p>' +
            (detail ? '<pre class="bootfail__detail">' + String(detail).slice(0, 400) + '</pre>' : '') +
            '<a class="bootfail__button" href="?reset=1">Clear and reload</a>' +
            '</div>';
        }

        if (reset) {
          var done = function () {
            location.replace(location.pathname);
          };
          var jobs = [];
          if (navigator.serviceWorker) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (all) {
                return Promise.all(all.map(function (r) { return r.unregister(); }));
              })
            );
          }
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          Promise.all(jobs).then(done, done);
          return;
        }

        window.addEventListener('error', function (event) {
          show('Swaranjali could not start.', event.message || (event.error && event.error.message));
        });

        // If nothing has rendered after a few seconds, the bundle never ran.
        setTimeout(function () {
          show('Swaranjali could not start. This is usually a stale offline copy.');
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
